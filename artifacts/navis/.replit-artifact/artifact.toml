kind = "web"
previewPath = "/"
title = "NAVIS"
description = "NAVIS Solana workspace for market analysis, Atlas decision records, policy-constrained proposals, wallet approval and verifiable transaction receipts."
version = "1.0.0"
id = "artifacts/navis"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19732

[services.development]
run = "pnpm --filter @workspace/navis run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/navis", "run", "build" ]
serve = "static"
publicDir = "artifacts/navis/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19732"
BASE_PATH = "/"
